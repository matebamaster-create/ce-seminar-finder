name: Build sample preview (no production deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare sample site
        run: |
          mkdir -p public
          cp -R site/. public/
          ! grep -R -E 'admin_note|auto_values|FieldOverrides|ReviewQueue' public
      - name: Upload downloadable sample preview
        uses: actions/upload-artifact@v4
        with:
          name: sample-preview-not-production
          path: public
          retention-days: 7

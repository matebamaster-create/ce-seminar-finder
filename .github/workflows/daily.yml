name: Daily collection and publish

on:
  push:
    branches: [main]
    paths: ["src/**", "site/**", "scripts/**", "data/**", ".github/workflows/daily.yml", "pyproject.toml"]
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      source_ids:
        description: "取得するsource_id（カンマ区切り、空なら管理画面で有効にした取得元）"
        required: false
        type: string
      collect_all:
        description: "西日本全体を一括取得する（空のsource_idsでも収集を実行）"
        required: true
        default: false
        type: boolean
      full_detail:
        description: "初回一括：終了済みを除く発見済み詳細ページをすべて取得"
        required: true
        default: false
        type: boolean
      resume_ai:
        description: "保存済みの非公開候補からAI処理だけを再開する（再収集なし）"
        required: true
        default: false
        type: boolean
      publish:
        description: "Sheetsから公開サイトを再生成する"
        required: true
        default: false
        type: boolean
      sync_current_events:
        description: "リポジトリの確認済みイベントをEventsへ同期する"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ce-seminar-finder-daily
  cancel-in-progress: false

jobs:
  collect-build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: administration
    outputs:
      publish_ready: ${{ steps.public-data.outputs.publish_ready }}
    env:
      CE_SPREADSHEET_ID: ${{ secrets.CE_SPREADSHEET_ID }}
      ENABLED_SOURCE_IDS: ${{ inputs.source_ids }}
      REQUESTED_PUBLISH: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install -e '.[google,pdf]'
      - name: Sync source catalog without overwriting events
        if: github.event_name == 'push' || inputs.sync_current_events
        run: python -m ce_seminar_finder.cli init-sheet --spreadsheet-id "$CE_SPREADSHEET_ID"
      - name: Install public-page renderer
        if: ${{ !inputs.resume_ai && (github.event_name == 'schedule' || inputs.source_ids != '' || inputs.collect_all) }}
        run: |
          npm install --prefix /tmp/ce-browser --no-save playwright
          /tmp/ce-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Collect explicitly enabled sources
        if: ${{ !inputs.resume_ai && (github.event_name == 'schedule' || inputs.source_ids != '' || inputs.collect_all) }}
        env:
          NODE_PATH: /tmp/ce-browser/node_modules
          FULL_DETAIL: ${{ inputs.full_detail }}
        run: |
          extra=()
          if [[ "$FULL_DETAIL" == "true" ]]; then extra+=(--full-detail); fi
          for region in kyushu chugoku-shikoku kansai tokai-hokuriku national; do
            python -m ce_seminar_finder.cli daily-run \
              --region "$region" --use-sheet-sources --render-public-pages \
              --enabled-sources "$ENABLED_SOURCE_IDS" \
              --spreadsheet-id "$CE_SPREADSHEET_ID" \
              --state-file "var/$region/fetch-state.json" \
              --work-directory "var/$region" --max-detail-pages 12 \
              --summary "var/$region/summary.json" \
              --candidates "var/$region/candidates.json" \
              --markdown-summary "var/$region/summary.md" "${extra[@]}"
          done
      - name: Add run summary
        if: always()
        run: |
          for summary in var/*/summary.md; do
            if [[ -f "$summary" ]]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Install Japanese PDF OCR
        if: github.event_name == 'schedule' || inputs.source_ids != '' || inputs.collect_all || inputs.resume_ai
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-jpn tesseract-ocr-eng
      - name: Refresh existing Google connection before AI
        if: github.event_name == 'schedule' || inputs.source_ids != '' || inputs.collect_all || inputs.resume_ai
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Refine all public candidates with AI and PDF (never auto-publish)
        id: ai-refine
        if: github.event_name == 'schedule' || inputs.source_ids != '' || inputs.collect_all || inputs.resume_ai
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESUME_AI: ${{ inputs.resume_ai }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "AIは未接続です。通常収集と承認済み情報の公開を継続します。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          input=(--input var/*/candidates.json)
          if [[ "$RESUME_AI" == "true" ]]; then input=(--from-sheet); fi
          python -m ce_seminar_finder.cli refine-candidates \
            "${input[@]}" --max-calls 0 --include-pdf \
            --spreadsheet-id "$CE_SPREADSHEET_ID" \
            --output var/ai-refined.json --summary var/ai-summary.json
      - name: Add bounded AI summary
        if: always()
        run: |
          if [[ -f var/ai-summary.json ]]; then
            python -c 'import json,os; s=json.load(open("var/ai-summary.json")); text="\n## AI補足（自動公開なし）\n候補反映: {}件 / API呼び出し: {}回 / 入力: {} tokens / 出力: {} tokens / エラー: {}件\n".format(s["refined"],s["requests"],s["input_tokens"],s["output_tokens"],len(s["errors"])); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write(text)'
            if ! python -c 'import json,sys; sys.exit(bool(json.load(open("var/ai-summary.json"))["errors"]))'; then
              echo "::warning::AI処理は途中停止です。保存済み候補から再開してください。"
              echo "⚠️ AI処理は未完了です。保存済み候補から再開できます。" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "${{ steps.ai-refine.outcome }}" == "failure" ]]; then
            echo "::warning::AI処理が集計前に停止しました。未完了として確認してください。"
            echo "⚠️ AI処理は集計前に停止し、未完了です。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive and export approved events
        id: public-data
        run: |
          echo "publish_ready=false" >> "$GITHUB_OUTPUT"
          if [[ "$REQUESTED_PUBLISH" != "true" ]]; then
            echo "手動実行で公開更新は選択されていません。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$CE_SPREADSHEET_ID" || -z "$GOOGLE_APPLICATION_CREDENTIALS" ]]; then
            echo "Sheets接続情報がないため公開更新をスキップしました。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m ce_seminar_finder.cli archive-sheet \
            --spreadsheet-id "$CE_SPREADSHEET_ID" \
            --as-of "$now"
          python -m ce_seminar_finder.cli export-public-from-sheet \
            --spreadsheet-id "$CE_SPREADSHEET_ID" \
            --output /tmp/events.json \
            --generated-at "$now"
          echo "publish_ready=true" >> "$GITHUB_OUTPUT"
      - name: Build Pages artifact
        if: steps.public-data.outputs.publish_ready == 'true'
        run: |
          mkdir -p public/assets public/data
          cp -R site/assets/. public/assets/
          cp /tmp/events.json public/data/events.json
          python -m ce_seminar_finder.cli build-site \
            --data public/data/events.json \
            --output-directory public
          ! grep -R -E 'admin_note|auto_values|FieldOverrides|ReviewQueue' public
      - name: Configure Pages
        if: steps.public-data.outputs.publish_ready == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.public-data.outputs.publish_ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Upload bounded run summaries (no candidate text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-diagnostics-${{ github.run_id }}
          path: |
            var/*/summary.json
            var/*/summary.md
            var/ai-summary.json
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: needs.collect-build.outputs.publish_ready == 'true'
    needs: collect-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
